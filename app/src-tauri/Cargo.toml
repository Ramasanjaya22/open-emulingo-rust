[package]
name = "oemu-app"
version = "0.1.0"
edition = "2021"
description = "Play GBA games and learn Japanese from the screen"
rust-version = "1.77"

[lib]
name = "oemu_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
oemu-core-types = { path = "../../crates/core-types" }
oemu-emu = { path = "../../crates/emu" }
oemu-store = { path = "../../crates/store" }
oemu-llm = { path = "../../crates/llm" }
